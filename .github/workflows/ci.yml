name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: linen/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: uv sync --project linen --locked --group dev
      - name: Run regression suite
        run: uv run --project linen --locked --group dev pytest linen/linen/tests
      - name: Build distribution
        run: uv build --project linen
