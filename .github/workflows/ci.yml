name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: linen/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: uv sync --project linen --locked --group dev
      - name: Run upstream validator test suites
        run: |
          node --test linen/src/linen/third_party/cloudflare_security_audit_skill/validate-coverage-ledger.test.cjs
          node --test linen/src/linen/third_party/cloudflare_security_audit_skill/validate-findings.test.cjs
      - name: Audit the browser UI static sinks
        run: node linen/linen/tests/ui_static_sink_check.cjs
      - name: Run regression suite
        run: uv run --project linen --locked --group dev pytest linen/linen/tests -ra --junitxml=linen/pytest-junit.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit
          path: linen/pytest-junit.xml
          if-no-files-found: ignore
      - name: Build distribution
        run: uv build --project linen
